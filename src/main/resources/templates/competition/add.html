<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
<title th:text="#{competition.add.label}"></title>
</head>
<body>
<header>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
</header>
<h1 th:text="#{competition.add.label}"></h1>
<p th:text="#{competition.add.summary}"></p>

<div>
    <form th:action="@{/competition/add}" th:object="${inputCompetitionDto}" method="post">

        <p th:if="${errorMessage}" class="error" th:text="${errorMessage}"></p>

        <p>
            <label th:text="#{label.teamA}"></label>
            <select th:field="*{teamA}">
                <option value="" th:text="#{competition.country.select}"></option>
                <option th:each="country : ${countries}" th:value="${country.id}"
                        th:text="${country.name}"></option>
            </select>
            <span
                th:if="${#fields.hasErrors('teamA')}" th:errorclass="error"
                th:errors="*{teamA}">
            </span>
        </p>

        <p>
            <label th:text="#{label.teamB}"></label>
            <select th:field="*{teamB}">
                <option value="" th:text="#{competition.country.select}"></option>
                <option th:each="country : ${countries}" th:value="${country.id}"
                        th:text="${country.name}"></option>
            </select>
            <span
                th:if="${#fields.hasErrors('teamB')}" th:errorclass="error"
                th:errors="*{teamB}">
            </span>
        </p>

        <p>
            <label th:text="#{label.stadium}"></label>
            <select th:field="*{stadium}">
                <option value="" th:text="#{competition.stadium.select}"></option>
                <option th:each="stadium : ${stadiums}" th:value="${stadium.id}"
                        th:attr="data-code=${stadium.code}"
                        th:text="|${stadium.location.city} - ${stadium.name}|"></option>
            </select>
            <span
                th:if="${#fields.hasErrors('stadium')}" th:errorclass="error"
                th:errors="*{stadium}">
            </span>
        </p>

        <p>
            <label th:text="#{label_competition_stadiumCode}"></label>
            <input type="number" th:field="*{stadiumCode}" min="0" max="9999" readonly />
            <span
                th:if="${#fields.hasErrors('stadiumCode')}" th:errorclass="error"
                th:errors="*{stadiumCode}">
            </span>
        </p>

        <p>
            <label th:text="#{label_competition_checksum}"></label>
            <input type="number" th:field="*{checksum}" min="0" max="96" />
            <span
                th:if="${#fields.hasErrors('checksum')}" th:errorclass="error"
                th:errors="*{checksum}">
            </span>
        </p>

        <p>
            <label th:text="#{label.date}"></label>
            <input
                    type="date" th:field="*{date}" />
            <span
                    th:if="${#fields.hasErrors('date')}" th:errorclass="error"
                    th:errors="*{date}">
            </span>
        </p>

        <p>
            <label th:text="#{label.time}"></label>
            <input
                    type="time" th:field="*{time}" />
            <span
                    th:if="${#fields.hasErrors('time')}" th:errorclass="error"
                    th:errors="*{time}">
            </span>
        </p>

        <button type="submit" th:text="#{competition.add.submit}"></button>
        <button type="reset" th:text="#{competition.add.reset}"></button>

    </form>
</div>

<script th:src="@{/js/matchStadiumChecksum.js}"></script>

</body>
</html>
