<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
    <title>Competitions</title>
</head>
<body>

<header>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
</header>

<main>
    <div class="page-header">
        <button><a th:href="@{/competition/add}" class="button">Add</a></button>
        <table>
            <tr>
                <th>Date</th>
                <th>Time</th>
                <th>Team A</th>
                <th>Team B</th>
                <th>Stadium</th>
                <th>City</th>
                <th>Score</th>
                <th>Match</th>
                <th>Action</th>
            </tr>

            <tr th:each="competition : ${competitionList}">
                <td th:text="${competition.date}"></td>
                <td th:text="${competition.time}"></td>
                <td th:text="${competition.teamA.name}"></td>
                <td th:text="${competition.teamB.name}"></td>
                <td th:text="${competition.stadium.name}"></td>
                <td th:text="${competition.stadium.location.city}"></td>
                <td th:if="${competition.scoreA != null and competition.scoreB != null}"
                    th:text="|${competition.scoreA} - ${competition.scoreB}|"></td>
                <td th:unless="${competition.scoreA != null and competition.scoreB != null}">TBD</td>
                <td><a th:href="|/competition/${competition.id}|" th:text="'Match'"></a></td>
                <td><a th:href="@{/competition/edit/{id}(id=${competition.id})}"><button>Edit</button></a></td>
            </tr>
        </table>
    </div>
</main>

<!--<div th:replace="~{fragments/footer :: footer}"></div> -->

</body>
</html>
