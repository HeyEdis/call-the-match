<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
    <title th:text="#{competition.list.title}"></title>
</head>
<body>

<header>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
</header>

<main class="competition-list-shell">
    <section class="competition-list-page">
        <header class="competition-list-header">
            <div>
                <h1 th:text="#{competition.list.title}"></h1>
            </div>
            <a th:href="@{/competition/add}" class="competition-list-add" th:text="#{competition.list.addButton}"></a>
        </header>

        <section>
            <div class="competition-list-table-wrap">
                <table class="competition-list-table">
                    <thead>
                    <tr>
                        <th th:text="#{label.date}"></th>
                        <th th:text="#{label.time}"></th>
                        <th th:text="#{label.teamA}"></th>
                        <th th:text="#{label.teamB}"></th>
                        <th th:text="#{label.stadium}"></th>
                        <th th:text="#{label.city}"></th>
                        <th th:text="#{label.score}"></th>
                        <th th:text="#{label.match}"></th>
                        <th th:text="#{label.action}"></th>
                        <th th:text="#{competition.list.result}"></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="competition : ${competitionList}">
                        <td th:text="${competition.date}"></td>
                        <td th:text="${competition.time}"></td>
                        <td th:text="${competition.teamA.name}"></td>
                        <td th:text="${competition.teamB.name}"></td>
                        <td th:text="${competition.stadium.name}"></td>
                        <td th:text="${competition.stadium.location.city}"></td>
                        <td th:if="${competition.scoreA != null and competition.scoreB != null}"
                            th:text="|${competition.scoreA} - ${competition.scoreB}|"></td>
                        <td th:unless="${competition.scoreA != null and competition.scoreB != null}"
                            th:text="#{competition.list.tbd}"></td>
                        <td>
                            <a class="competition-list-match-link"
                               th:href="@{/competition/{id}(id=${competition.id})}"
                               th:text="#{label.match}"></a>
                        </td>
                        <td>
                            <a class="competition-list-edit-link"
                               th:href="@{/competition/edit/{id}(id=${competition.id})}"
                               th:text="#{competition.list.edit}"></a>
                        </td>
                        <td>
                            <a class="competition-list-edit-link"
                               th:href="@{/competition/{id}/result(id=${competition.id})}"
                               th:text="#{competition.result.record}"></a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(competitionList)}">
                        <td colspan="10" th:text="#{competition.list.noFixtures}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </section>
</main>

</body>
</html>
