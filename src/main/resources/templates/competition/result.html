<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
    <title th:text="#{competition.detail.officialResult}">Official result</title>
</head>
<body>
<header>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
</header>

<h1 th:text="#{competition.detail.officialResult}">Official result</h1>
<p th:text="#{competition.result.summary}">Record the official scores for this match.</p>
<p th:text="|${competition.teamA.name} vs ${competition.teamB.name}|"></p>

<div>
    <form th:action="@{/competition/{id}/result(id=${competition.id})}"
          th:object="${inputCompetitionResultDto}" method="post">

        <p th:if="${errorMessage}" class="error" th:text="${errorMessage}"></p>

        <p>
            <label th:text="#{label_competition_scoreA}"></label>
            <input type="number" th:field="*{scoreA}" min="0"/>
            <span th:if="${#fields.hasErrors('scoreA')}" th:errorclass="error" th:errors="*{scoreA}"></span>
        </p>

        <p>
            <label th:text="#{label_competition_scoreB}"></label>
            <input type="number" th:field="*{scoreB}" min="0"/>
            <span th:if="${#fields.hasErrors('scoreB')}" th:errorclass="error" th:errors="*{scoreB}"></span>
        </p>

        <button type="submit" th:text="#{competition.add.submit}">Save</button>
        <button type="reset" th:text="#{competition.add.reset}">Reset</button>
    </form>
</div>

</body>
</html>
