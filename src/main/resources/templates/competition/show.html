<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
    <title th:text="#{competition.show.title}"></title>
</head>
<body>
<header>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
</header>

<main class="match-shell">
    <section class="match-page match-page-final">
        <p th:if="${successMessage}" class="success match-message" th:text="${successMessage}"></p>

        <div class="match-final-grid">
            <article class="match-final-hero">
                <p class="match-eyebrow" th:text="#{competition.detail.title}"></p>
                <h1>
                    <span th:text="${competition.teamA.name}"></span>
                    <small>vs</small>
                    <span th:text="${competition.teamB.name}"></span>
                </h1>
                <dl>
                    <div>
                        <dt th:text="#{label.date}"></dt>
                        <dd th:text="${competition.date}"></dd>
                    </div>
                    <div>
                        <dt th:text="#{label.time}"></dt>
                        <dd th:text="${competition.time}"></dd>
                    </div>
                </dl>
            </article>

            <aside class="match-final-result">
                <div>
                    <span th:text="#{competition.detail.officialResult}"></span>
                    <strong th:if="${competition.scoreA != null and competition.scoreB != null}"
                            th:text="|${competition.scoreA} - ${competition.scoreB}|"></strong>
                    <em th:unless="${competition.scoreA != null and competition.scoreB != null}"
                        th:text="#{competition.detail.noResult}"></em>
                </div>

                <div sec:authorize="hasRole('USER')" th:if="${currentUserPrediction != null}" class="match-final-prediction">
                    <span th:text="#{prediction.own.score}"></span>
                    <strong th:text="|${currentUserPrediction.predictedScoreA} - ${currentUserPrediction.predictedScoreB}|"></strong>
                </div>
            </aside>
        </div>

        <div class="match-final-details">
            <article>
                <span th:text="#{label.stadium}"></span>
                <strong th:text="${competition.stadium.name}"></strong>
            </article>
            <article>
                <span th:text="#{competition.detail.location}"></span>
                <strong th:text="${competition.stadium.location.city}"></strong>
            </article>
            <article sec:authorize="hasRole('USER')" class="match-final-prediction-card">
                <span sec:authorize="hasRole('USER')" th:if="${currentUserPrediction != null}"
                      th:text="#{prediction.own.score}"></span>
                <span sec:authorize="hasRole('USER')" th:unless="${currentUserPrediction != null}"
                      ></span>
                <strong th:text="#{prediction.form.help}"></strong>
                <a class="match-primary-action"
                   th:href="@{/predictions/{competitionId}(competitionId=${competition.id})}"
                   th:text="#{prediction.link}"></a>
            </article>
            <article sec:authorize="hasRole('ADMIN')" class="match-final-prediction-card match-final-controls-card">
                <strong>Match Controls</strong>
                <div class="match-final-actions">
                    <a class="match-action-link"
                       th:href="@{/competition/edit/{id}(id=${competition.id})}"
                       th:text="#{competition.detail.edit}"></a>
                    <a class="match-action-link"
                       th:href="@{/competition/{id}/result(id=${competition.id})}"
                       th:text="#{competition.result.link}"></a>
                </div>
            </article>
        </div>
    </section>
</main>

</body>
</html>
