<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
    <title>Competition</title>
</head>
<body>
<header>
  <div th:replace="~{fragments/navbar :: navbar}"></div>
</header>

<div>
  <p th:text="|${competition.teamA.name} vs ${competition.teamB.name}|"></p>
  <div>
    <p th:text="${competition.date}"></p>
    <p th:text="${competition.time}"></p>
    <p th:text="${competition.stadium.name}"></p>
    <p th:text="${competition.stadium.location.city}"></p>
    <p th:if="${competition.scoreA != null and competition.scoreB != null}"
       th:text="|${competition.scoreA} - ${competition.scoreB}|"></p>
    <p th:unless="${competition.scoreA != null and competition.scoreB != null}">TBD</p>
  </div>
</div>


</body>
</html>
