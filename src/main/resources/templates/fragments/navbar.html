<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<body>
<nav th:fragment="navbar" class="glass-nav">
    <div class="nav-inner">
      <span th:text="#{brand.name}"></span>
      <a sec:authorize="!hasRole('ADMIN')" th:href="@{/home}" th:text="#{nav.home}"></a>
      <a th:href="@{/team/ranking}" th:text="#{nav.topTeams}"></a>
      <a sec:authorize="hasRole('USER')" th:href="@{/team/dashboard}" th:text="#{nav.myTeams}"></a>
      <a sec:authorize="hasRole('USER')" th:href="@{/predictions}" th:text="#{nav.myPredictions}"></a>
      <a sec:authorize="hasRole('ADMIN')" th:href="@{/competition}" th:text="#{nav.manageMatches}"></a>
      <a sec:authorize="isAnonymous()" th:href="@{/login}" th:text="#{nav.login}"></a>
      <a sec:authorize="isAnonymous()" th:href="@{/register}" class="btn-register" th:text="#{nav.register}"></a>
      <div th:replace="~{fragments/localeSwitcher :: locale-switch}"></div>
      <span sec:authorize="hasRole('ADMIN')" th:text="#{nav.admin}"></span>
      <span sec:authorize="hasRole('USER')" th:text="#{nav.user}"></span>
      <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit" th:text="#{logout.submit}"></button>
      </form>
    </div>
</nav>
</body>
</html>
