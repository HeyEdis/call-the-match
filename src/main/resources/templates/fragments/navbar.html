<head>
  <meta charset="UTF-8">
</head>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<nav th:fragment="navbar" class="glass-nav">
    <div class="nav-inner">
      <span>Call The Match</span>
      <a sec:authorize="!hasRole('ADMIN')" th:href="@{/home}">Home</a>
      <a sec:authorize="!hasRole('ADMIN')" th:href="@{/team/ranking}">Top 10 Teams</a>
      <a sec:authorize="hasRole('USER')" th:href="@{/team/dashboard}">My Teams</a>
      <a sec:authorize="hasRole('USER')" th:href="@{/predictions}">My Predictions</a>
      <a sec:authorize="hasRole('ADMIN')" th:href="@{/competition}">Manage Matches</a>
      <a sec:authorize="isAnonymous()" th:href="@{/login}">Login</a>
      <a sec:authorize="isAnonymous()" th:href="@{/register}" class="btn-register">Register</a>
      <span sec:authorize="hasRole('ADMIN')">ADMIN</span>
      <span sec:authorize="hasRole('USER')">USER</span>
      <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit" th:text="#{logout.submit}">Logout</button>
      </form>
    </div>
</nav>
</html>
