<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
  <title th:text="#{home.title}"></title>
</head>
<body>

<header>
  <div th:replace="~{fragments/navbar :: navbar}"></div>
</header>

<main class="home-prototype-shell">
  <p th:if="${successMessage}" class="success" th:text="${successMessage}"></p>

  <section class="home-variant variant-stadium-pulse">
    <div class="pulse-hero">
      <div class="pulse-copy">
        <h1>World Cup 2026 <strong>Schedule</strong></h1>
        <p th:text="#{schedule.desc}"></p>
      </div>
    </div>

    <div class="pulse-layout">
      <div class="pulse-list">
        <article class="pulse-row" th:each="competition : ${competitionList}">
          <div class="pulse-date">
            <span th:text="${competition.date}"></span>
            <small th:text="${competition.time}"></small>
          </div>
          <div class="pulse-teams">
            <strong th:text="${competition.teamA.name}"></strong>
            <span>vs</span>
            <strong th:text="${competition.teamB.name}"></strong>
          </div>
          <div class="pulse-place">
            <span th:text="${competition.stadium.name}"></span>
            <small th:text="${competition.stadium.location.city}"></small>
          </div>
          <div class="pulse-score">
            <strong th:if="${competition.scoreA != null and competition.scoreB != null}"
                    th:text="|${competition.scoreA} - ${competition.scoreB}|"></strong>
            <em th:unless="${competition.scoreA != null and competition.scoreB != null}" th:text="#{competition.list.tbd}"></em>
          </div>
          <a class="match-pill" th:href="|/competition/${competition.id}|">Match</a>
        </article>
      </div>
    </div>
  </section>
</main>

</body>
</html>
