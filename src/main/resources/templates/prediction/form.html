<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
    <title th:text="#{prediction.form.label}"></title>
</head>
<body>
<header>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
</header>

<main class="prediction-shell">
    <section class="prediction-variant prediction-variant-sheet">
        <div class="prediction-sheet-grid">
            <article class="prediction-match-card">
                <p class="match-eyebrow" th:text="#{competition.detail.title}"></p>
                <h1>
                    <span th:text="${competition.teamA.name}"></span>
                    <small>vs</small>
                    <span th:text="${competition.teamB.name}"></span>
                </h1>
                <dl>
                    <div>
                        <dt th:text="#{label.date}"></dt>
                        <dd th:text="${competition.date}"></dd>
                    </div>
                    <div>
                        <dt th:text="#{label.time}"></dt>
                        <dd th:text="${competition.time}"></dd>
                    </div>
                    <div>
                        <dt th:text="#{label.stadium}"></dt>
                        <dd th:text="${competition.stadium.name}"></dd>
                    </div>
                </dl>
            </article>

            <article class="prediction-entry-card">
                <p class="match-eyebrow" th:text="#{prediction.form.label}"></p>
                <h2 th:text="#{prediction.save.submit}"></h2>

                <div th:if="${cutoffPassed}" class="prediction-closed">
                    <p th:text="#{prediction.cutoff.closed}"></p>
                </div>

                <form th:unless="${cutoffPassed}"
                      class="prediction-score-form"
                      th:action="@{/predictions/{competitionId}(competitionId=${competition.id})}"
                      th:object="${inputPredictionDto}" method="post">
                    <p th:if="${errorMessage}" class="prediction-form-error" th:text="${errorMessage}"></p>

                    <div class="prediction-score-row">
                        <label>
                            <span th:text="${competition.teamA.name}"></span>
                            <input type="number" th:field="*{predictedScoreA}" min="0"/>
                        </label>
                        <strong>-</strong>
                        <label>
                            <span th:text="${competition.teamB.name}"></span>
                            <input type="number" th:field="*{predictedScoreB}" min="0"/>
                        </label>
                    </div>

                    <p class="prediction-field-error"
                       th:if="${#fields.hasErrors('predictedScoreA')}"
                       th:errors="*{predictedScoreA}"></p>
                    <p class="prediction-field-error"
                       th:if="${#fields.hasErrors('predictedScoreB')}"
                       th:errors="*{predictedScoreB}"></p>

                    <div class="prediction-form-actions">
                        <button class="match-primary-action" type="submit" th:text="#{prediction.save.submit}"></button>
                        <button class="match-action-link" type="button" onclick="history.back()" th:text="#{button.cancel}"></button>
                    </div>
                </form>
            </article>
        </div>
    </section>
</main>

</body>
</html>
