<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
    <title>Top 10 Teams</title>
</head>
<body>

<header>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
</header>

<main>
    <div class="page-header">
        <h1 class="page-title font-headline">Public Top 10 Teams</h1>
        <p>The teams with the highest total score.</p>

        <table>
            <tr>
                <th>Rank</th>
                <th>Team Name</th>
                <th>Total Score</th>
                <th>Member Count</th>
            </tr>

            <tr th:each="team, stat : ${teamList}">
                <td th:text="${stat.count}"></td>
                <td th:text="${team.name}"></td>
                <td th:text="${team.score}"></td>
                <td th:text="${team.members.size()}"></td>
            </tr>
        </table>
    </div>
</main>

</body>
</html>
