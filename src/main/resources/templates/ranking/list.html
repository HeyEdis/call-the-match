<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
    <title th:text="#{ranking.title}">Top 10 Teams</title>
</head>
<body>

<header>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
</header>

<main>
    <div class="page-header">
        <h1 class="page-title font-headline" th:text="#{ranking.heading}">Public Top 10 Teams</h1>
        <p th:text="#{ranking.summary}">The teams with the highest total score.</p>

        <table>
            <tr>
                <th th:text="#{ranking.rank}">Rank</th>
                <th th:text="#{ranking.teamName}">Team Name</th>
                <th th:text="#{ranking.totalScore}">Total Score</th>
                <th th:text="#{ranking.memberCount}">Member Count</th>
            </tr>

            <tr th:each="team, stat : ${teamList}">
                <td th:text="${stat.count}"></td>
                <td th:text="${team.name}"></td>
                <td th:text="${team.score}"></td>
                <td th:text="${team.memberCount}"></td>
            </tr>
        </table>
    </div>
</main>

</body>
</html>
