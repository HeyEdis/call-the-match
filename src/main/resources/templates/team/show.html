<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
    <title th:text="#{team.show.title}"></title>
</head>
<body>

<header>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
</header>

<main class="team-show-prototype-shell">

    <section class="team-show-variant">
        <header class="team-stitch-hero">
            <div class="team-stitch-title">
                <p class="team-rank-pill">
                    <span th:text="#{ranking.rank}"></span>
                    <span>#</span><span th:text="${rank}"></span>
                </p>
                <h1 th:text="${team.name}"></h1>
                <a th:href="@{/team/{id}/scoreboard(id=${team.id})}" th:text="#{team.scoreboard.title}"></a>
            </div>
            <div class="team-stitch-score">
                <span th:text="#{team.score.label}"></span>
                <strong th:text="${team.score}"></strong>
            </div>
        </header>

        <div class="team-stitch-content">
            <section class="team-stitch-members" aria-labelledby="teamMembersA">
                <h2 id="teamMembersA" th:text="#{team.show.members}"></h2>
                <div class="team-stitch-table-wrap">
                    <table class="team-stitch-table">
                        <thead>
                        <tr>
                            <th th:text="#{label.member}"></th>
                            <th th:text="#{label.role}"></th>
                            <th th:text="#{label.personalScore}"></th>
                            <th th:text="#{label.activeSince}"></th>
                            <th th:if="${isOwner}" th:text="#{label.actions}"></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="member : ${team.members}">
                            <td>
                                <span class="team-avatar" th:text="${#strings.substring(member.user.userName, 0, 1)}"></span>
                                <strong th:text="${member.user.userName}"></strong>
                            </td>
                            <td>
                                <span th:class="${member.role.name() == 'OWNER' ? 'role-chip is-owner' : 'role-chip'}"
                                      th:text="${member.role}"></span>
                            </td>
                            <td class="team-member-score" th:text="${member.score}"></td>
                            <td class="team-muted-date" th:text="${{member.joinedAt}}"></td>
                            <td th:if="${isOwner}">
                                <span th:if="${member.role.name() == 'OWNER'}" class="team-protected" th:text="#{team.show.protected}"></span>
                                <form th:if="${member.role.name() != 'OWNER'}"
                                      th:action="@{/team/{id}/members/{memberId}/remove(id=${team.id}, memberId=${member.id})}" method="post">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <button class="team-icon-button" type="submit" th:title="#{team.member.remove}"
                                            th:text="#{team.member.remove}"></button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </section>

            <section class="team-stitch-recruit" aria-labelledby="recruitA">
                <h2 id="recruitA" th:text="#{team.recruitment}"></h2>
                <p>
                    <strong th:text="#{team.inviteCode.shareTitle}"></strong>
                    <span th:text="#{team.inviteCode.shareHelp}"></span>
                </p>
                <div class="invite-code-row">
                    <div class="invite-code-field">
                        <label for="inviteCodeA" th:text="#{team.inviteCode.label}"></label>
                        <input id="inviteCodeA" type="text" th:value="${team.inviteCode}" readonly/>
                        <form th:if="${isOwner}" th:action="@{/team/{id}/invite-code(id=${team.id})}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button class="team-text-button" type="submit" th:text="#{team.inviteCode.regenerate}"></button>
                        </form>
                    </div>
                    <button class="invite-copy-button" type="button"
                            onclick="navigator.clipboard.writeText(document.getElementById('inviteCodeA').value)"
                            th:text="#{team.inviteCode.copy}"></button>
                </div>
                <p th:if="${message}" class="success team-show-message" th:text="${message}"></p>
            </section>
        </div>
    </section>
</main>

</body>
</html>
