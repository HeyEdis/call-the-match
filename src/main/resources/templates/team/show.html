<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
    <title th:text="#{team.show.title}"></title>
</head>
<body>

<header>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
</header>

<div>
    <p>Rank: #<span th:text="${rank}"></span></p>
    <h2 th:text="${team.name}"></h2>
</div>

<div>
    <h2 th:text="#{team.score.label}"></h2>
    <p th:text="${team.score}"></p>
     <p>
          <a th:href="@{|/team/${team.id}/scoreboard|}"
             th:text="#{team.scoreboard.title}"></a>
      </p>
</div>
<div>
    <table>
        <tr>
            <th th:text="#{label.member}"></th>
            <th th:text="#{label.role}"></th>
            <th th:text="#{label.personalScore}"></th>
            <th th:text="#{label.activeSince}"></th>
            <th th:if="${isOwner}" th:text="#{label.actions}"></th>

        </tr>

        <tr th:each="member : ${team.members}">
            <td th:text="${member.user.userName}"></td>
            <td th:text="${member.role}"></td>
            <td th:text="${member.score}"></td>
            <td th:text="${{member.joinedAt}}"></td>
            <td th:if="${isOwner}">
                <form th:if="${member.role.name() != 'OWNER'}"
                      th:action="@{|/team/${team.id}/members/${member.id}/remove|}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" th:text="#{team.member.remove}"></button>
                </form>
            </td>
        </tr>
    </table>
</div>

<div>
    <h2 th:text="#{team.recruitment}"></h2>
    <span th:text="#{team.inviteCode.label}"></span>
    <p th:text="${team.inviteCode}"></p>
    <form th:if="${isOwner}" th:action="@{|/team/${team.id}/invite-code|}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit" th:text="#{team.inviteCode.regenerate}"></button>
    </form>
    <p th:if="${message}" th:text="${message}"></p>
</div>

</body>
</html>
