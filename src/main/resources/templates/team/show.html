<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
    <title>Team</title>
</head>
<body>

<header>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
</header>

<div>
    <p>Rank: #1</p>
    <h2 th:text="${team.name}"></h2>
</div>

<div>
    <h2>Team Score</h2>
    <p th:text="${team.score}"></p>
</div>
<div>
    <table>
        <tr>
            <th>Member</th>
            <th>Role</th>
            <th>Personal Score</th>
            <th>Active Since</th>
            <th th:if="${isOwner}">Actions</th>

        </tr>

        <tr th:each="member : ${team.members}">
            <td th:text="${member.user.userName}"></td>
            <td th:text="${member.role}"></td>
            <td th:text="${member.score}"></td>
            <td th:text="${{member.joinedAt}}"></td>
            <td th:if="${isOwner}">
                <form th:if="${member.role.name() != 'OWNER'}"
                      th:action="@{|/team/${team.id}/members/${member.id}/remove|}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" th:text="#{team.member.remove}">Remove</button>
                </form>
            </td>
        </tr>
    </table>
</div>

<div>
    <h2>Recruit Members</h2>
    <span>PRIVATE INVITE CODE</span>
    <p th:text="${team.inviteCode}"></p>
    <form th:if="${isOwner}" th:action="@{|/team/${team.id}/invite-code|}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit" th:text="#{team.inviteCode.regenerate}">Regenerate Code</button>
    </form>
    <p th:if="${message}" th:text="${message}"></p>
</div>


<!-- <a th:href="|/contacts/edit/${contact.id}|"><Button th:text="Update"></Button></a> -->



</body>
</html>
